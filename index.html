<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Small games and handy apps by tsotoshi. Everything runs in your browser.">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tsotoshi Workshop</title>
<script>
  /* Apply a saved light/dark choice before the page draws, so it doesn't flash. */
  try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a shelf of game "cartridges" — big screenshot, label strip with genre, keys and two actions. One column on phones, two on desktop. */
:root {
  --bg: #e9ecf2;
  --surface: #ffffff;
  --ink: #12151c;
  --muted: #5b6273;
  --line: #d3d8e2;
  --accent: #2f4bff;
  --accent-ink: #ffffff;
  --key: #f3f5f9;
  --wip: #b25d00;
  --wip-bg: #fff1df;
  --font-display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f2229; --surface: #2a2e37; --ink: #eceef3; --muted: #a3a9b8; --line: #3b404c;
    --accent: #7d92ff; --accent-ink: #0b0e16; --key: #343944; --wip: #ffb45c; --wip-bg: #33240f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f2229; --surface: #2a2e37; --ink: #eceef3; --muted: #a3a9b8; --line: #3b404c;
  --accent: #7d92ff; --accent-ink: #0b0e16; --key: #343944; --wip: #ffb45c; --wip-bg: #33240f;
  color-scheme: dark;
}

body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
}
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 48px 72px;
  display: grid; gap: 40px;
}

/* Header */
header { display: grid; gap: 14px; }
.topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.theme-btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  font: 600 14px var(--font-body); color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px 6px 10px;
}
.theme-btn:hover { border-color: var(--ink); }
.theme-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.theme-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.handle { font-family: var(--font-mono); font-size: 13px; color: var(--muted); letter-spacing: .04em; }
h1 {
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(44px, 9vw, 104px); line-height: .9; letter-spacing: -.035em;
  margin: 0; text-wrap: balance;
}
h1 .dot { color: var(--accent); }
.lede { margin: 0; max-width: 56ch; font-size: 18px; color: var(--muted); }
.lede strong { color: var(--ink); font-weight: 600; }

/* Filter */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; border-top: 2px solid var(--ink); padding-top: 14px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button {
  font: 600 14px var(--font-body); color: var(--ink); background: transparent;
  border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filters button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Grid of cartridges */
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 28px; }
.cart {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden;
  display: grid; grid-template-rows: auto 1fr; min-width: 0;
  transition: transform .2s ease, box-shadow .2s ease;
}
.cart:hover { transform: translateY(-3px); box-shadow: 0 14px 30px -18px rgba(15, 20, 40, .45); }
.screen { position: relative; aspect-ratio: 2 / 1; max-width: 100%; background: var(--key); overflow: hidden; border-bottom: 1.5px solid var(--line); }
.screen img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; transition: transform .4s ease; }
.cart:hover .screen img { transform: scale(1.03); }
.screen .placeholder {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  font-family: var(--font-mono); font-size: 13px; color: var(--muted);
  background: repeating-linear-gradient(-45deg, var(--key) 0 14px, var(--surface) 14px 28px);
}
.label { padding: 20px 22px 22px; display: grid; gap: 12px; align-content: start; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tag { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; }
.tag.wip { color: var(--wip); background: var(--wip-bg); border-color: transparent; }
.date { margin-left: auto; font: 500 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1.05; letter-spacing: -.02em; margin: 0; }
.desc { margin: 0; color: var(--muted); max-width: 60ch; }
.keys { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.keys span { display: inline-flex; align-items: center; gap: 6px; }
kbd {
  font: 500 12px var(--font-mono); color: var(--ink); background: var(--key);
  border: 1px solid var(--line); border-bottom-width: 2.5px; border-radius: 5px; padding: 1px 6px;
}
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
  font: 600 15px var(--font-body); border-radius: 8px; padding: 9px 16px;
}
.btn.play { background: var(--accent); color: var(--accent-ink); }
.btn.play:hover { filter: brightness(1.08); }
.btn.src { color: var(--ink); border: 1.5px solid var(--line); }
.btn.src:hover { border-color: var(--ink); }
.btn svg { width: 14px; height: 14px; fill: currentColor; }

footer { border-top: 1.5px solid var(--line); padding-top: 18px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--muted); }
footer a { color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  .cart, .screen img { transition: none; }
  .cart:hover { transform: none; }
  .cart:hover .screen img { transform: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="topline">
      <div class="handle">github.com/tsotoshi</div>
      <button type="button" class="theme-btn" id="theme-btn" aria-label="Switch to dark mode"></button>
    </div>
    <h1>Tsotoshi<br>Workshop<span class="dot">.</span></h1>
    <p class="lede">Small games and handy apps I've built. <strong>Everything runs in your browser</strong>, so there's nothing to install. Pick one and press Play.</p>
  </header>

  <div class="toolbar">
    <div class="filters" role="group" aria-label="Filter projects">
      <button type="button" id="f-all" data-filter="all" aria-pressed="true">All</button>
      <button type="button" id="f-game" data-filter="game" aria-pressed="false">Games</button>
      <button type="button" id="f-app" data-filter="app" aria-pressed="false">Apps</button>
    </div>
    <div class="count" id="count"></div>
  </div>

  <main class="shelf" id="shelf"></main>

  <footer>
    <span>Made by tsotoshi</span>
    <a href="https://github.com/tsotoshi" target="_blank" rel="noopener">All code on GitHub</a>
  </footer>
</div>

<script>
/* To add a project, copy one block below and change the fields.
   kind: "game" or "app". status: "live" or "wip".
   created: when the project was started. The page lists the newest first. */
const PROJECTS = [
  {
    name: "Midgar Flap", kind: "game", status: "live", genre: "One-button arcade · Fan game",
    created: "2026-11-10T22:23:07Z",
    shot: "shots/ff7-flappy.jpg",
    desc: "An FF7-inspired flapper: glide a spiky-haired mercenary through the mako-lit ducts and reactor pipes of a night-time industrial city. It speeds up and the gaps tighten as you go. A fan work, not affiliated with Square Enix.",
    keys: [["Space", "flap"], ["P", "pause"], ["M", "mute"]],
    play: "https://tsotoshi.github.io/ff7-flappy/",
    repo: "https://github.com/tsotoshi/ff7-flappy"
  },
  {
    name: "TravelTrax", kind: "app", status: "live", genre: "Travel · Expenses & points",
    created: "2026-11-09T20:11:33Z",
    shot: "shots/traveltrax.jpg?v=3",
    desc: "Track what each trip really cost in cash, points and fees: flights, hotels, transport, activities and food. See totals by year, category and loyalty program, and import past trips from a spreadsheet.",
    keys: [],
    play: "https://traveltrax.vercel.app",
    repo: "https://github.com/tsotoshi/TravelTrax"
  },
  {
    name: "The Collection", kind: "app", status: "live", genre: "Photo portfolio · Firearms",
    created: "2026-11-08T17:51:52-05:00",
    shot: "shots/firearm-collection.jpg",
    desc: "A photo record of my firearms collection: 13 pieces from FN, Glock, SIG Sauer, Atlas Gunworks and more. Open any piece to browse its album full-screen.",
    keys: [["← →", "next photo"], ["Esc", "close"]],
    play: "https://tsotoshi.github.io/Firearm-Collection/",
    repo: "https://github.com/tsotoshi/Firearm-Collection"
  },
  {
    name: "Midnight Jelly", kind: "game", status: "live", genre: "One-button arcade",
    created: "2026-11-06T20:43:18-05:00",
    shot: "shots/midnight-jelly.jpg",
    desc: "Pulse a glowing jellyfish between basalt stacks and dive through the ocean's depth zones. New zones open at 1,000, 4,000 and 6,000 m. Riptide mode starts faster and keeps speeding up.",
    keys: [["Space", "pulse"], ["P", "pause"]],
    play: "https://tsotoshi.github.io/midnight-jelly/",
    repo: "https://github.com/tsotoshi/midnight-jelly"
  },
  {
    name: "Range Day", kind: "game", status: "live", genre: "Shooting · USPSA-style",
    created: "2026-11-05T02:34:16Z",
    shot: "shots/range-day.jpg",
    desc: "Wait for the beep, then put two hits on each cardboard target as fast as you can. Three stages with no-shoots, hard cover and a small target. Scored by hit factor: points ÷ seconds.",
    keys: [["Click", "fire"]],
    play: "https://tsotoshi.github.io/Range-Day/",
    repo: "https://github.com/tsotoshi/Range-Day"
  },
  {
    name: "Connect Four", kind: "game", status: "live", genre: "Strategy · 1–2 players",
    created: "2026-11-05T14:12:01-05:00",
    shot: "shots/connect-4.jpg",
    desc: "Drop discs and line up four. Play the computer on Easy, Medium or Hard, or pass the device to a friend.",
    keys: [["1–7", "drop"], ["U", "undo"], ["N", "new game"]],
    play: "https://tsotoshi.github.io/Connect-4/",
    repo: "https://github.com/tsotoshi/Connect-4"
  },
  {
    name: "Crack the Safe", kind: "game", status: "live", genre: "Number puzzle",
    created: "2026-11-05T01:59:06Z",
    shot: "shots/crack-the-safe.jpg",
    desc: "The code is a number from 1 to 100. You get 7 tries and 60 seconds. Each guess tells you which way to turn the dial.",
    keys: [["Enter", "try a guess"]],
    play: "https://tsotoshi.github.io/Crack-the-safe/",
    repo: "https://github.com/tsotoshi/Crack-the-safe"
  },
  {
    name: "Shopping & Returns Tracker", kind: "app", status: "wip", genre: "Utility",
    created: "2026-11-05T08:19:09-05:00",
    shot: null,
    desc: "Keep track of what you bought and which returns are still open, so no refund window slips by.",
    keys: [],
    play: null,
    repo: "https://github.com/tsotoshi/Shopping-and-Returns-tracker"
  }
];

const ICON_PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>';
const ICON_CODE = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.7 4.3 2 8l3.7 3.7 1-1L4 8l2.7-2.7zm4.6 0-1 1L12 8l-2.7 2.7 1 1L14 8z"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });

function card(p) {
  const screen = p.shot
    ? `<img src="${esc(p.shot)}" alt="Screenshot of ${esc(p.name)}" loading="lazy">`
    : `<div class="placeholder">In the workshop<br>screenshot coming soon</div>`;
  const keys = p.keys.length
    ? `<div class="keys">${p.keys.map(([k, a]) => `<span><kbd>${esc(k)}</kbd>${esc(a)}</span>`).join("")}</div>` : "";
  const play = p.play
    ? `<a class="btn play" href="${esc(p.play)}" target="_blank" rel="noopener">${ICON_PLAY}${p.kind === "game" ? "Play" : "Open"}</a>` : "";
  return `<article class="cart" data-kind="${p.kind}">
    <div class="screen">${screen}</div>
    <div class="label">
      <div class="meta">
        <span class="tag">${p.kind === "game" ? "Game" : "App"}</span>
        <span class="tag">${esc(p.genre)}</span>
        ${p.status === "wip" ? '<span class="tag wip">In progress</span>' : ""}
        <time class="date" datetime="${esc(p.created)}">${fmtDate(p.created)}</time>
      </div>
      <h2>${esc(p.name)}</h2>
      <p class="desc">${esc(p.desc)}</p>
      ${keys}
      <div class="actions">${play}<a class="btn src" href="${esc(p.repo)}" target="_blank" rel="noopener">${ICON_CODE}Source</a></div>
    </div>
  </article>`;
}

const shelf = document.getElementById("shelf");
const count = document.getElementById("count");
const buttons = document.querySelectorAll("[data-filter]");

function render(filter) {
  const list = PROJECTS
    .filter(p => filter === "all" || p.kind === filter)
    .sort((a, b) => new Date(b.created) - new Date(a.created));
  shelf.innerHTML = list.map(card).join("");
  const g = list.filter(p => p.kind === "game").length, a = list.length - g;
  count.textContent = [g && `${g} game${g > 1 ? "s" : ""}`, a && `${a} app${a > 1 ? "s" : ""}`].filter(Boolean).join(" · ");
  buttons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.filter === filter)));
  try { localStorage.setItem("filter", filter); } catch (e) {}
}
buttons.forEach(b => b.addEventListener("click", () => render(b.dataset.filter)));
let start = "all";
try { start = localStorage.getItem("filter") || "all"; } catch (e) {}
render(["all", "game", "app"].includes(start) ? start : "all");

/* Light / dark switch. Until clicked, the page follows the device's setting. */
const themeBtn = document.getElementById("theme-btn");
const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
const SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const isDark = () => {
  const t = document.documentElement.dataset.theme;
  return t ? t === "dark" : darkQuery.matches;
};
function paintThemeBtn() {
  const dark = isDark();
  themeBtn.innerHTML = dark ? `${SUN}Light mode` : `${MOON}Dark mode`;
  themeBtn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
}
themeBtn.addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch (e) {}
  paintThemeBtn();
});
darkQuery.addEventListener("change", paintThemeBtn);
new MutationObserver(paintThemeBtn).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
paintThemeBtn();
</script>
</body>
</html>
